<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="c8BgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="#044AB3" />
      <stop offset="1" stopColor="#021B47" />
    </linearGradient>
    <linearGradient id="c8Flame" x1="32" y1="12" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FFFFFF" />
      <stop offset="0.35" stopColor="#6FE3FF" />
      <stop offset="1" stopColor="#044AB3" />
    </linearGradient>
    <filter id="c8FavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  {/* Base Rounded Tile */}
  <rect width="64" height="64" rx="16" fill="url(#c8BgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#6FE3FF" stroke-width="1.5" stroke-opacity="0.3" />

