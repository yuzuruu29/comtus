  <circle cx="32" cy="30" r="16" fill="#6FE3FF" opacity="0.25" filter="url(#c8FavGlow)" />

  {/* High-Precision Cognitive Flame */}
  <path
    d="M 32 10 C 39 19, 44 26, 44 33 A 12 12 0 1 1 20 33 C 20 26, 25 19, 32 10 Z"
    fill="url(#c8Flame)"
  />

  {/* Pure White Radiance Core */}
  <path
    d="M 32 20 C 35.5 25, 38 28.5, 38 32 A 6 6 0 1 1 26 32 C 26 28.5, 28.5 25, 32 20 Z"
    fill="#FFFFFF"
  />

  {/* Base Foundation Geometric Hairline */}
  <rect x="18" y="49" width="28" height="2" rx="1" fill="#6FE3FF" opacity="0.85" />
