name: Desktop release build

# Builds the Comtus Desk App (Tauri 2) for macOS (Apple Silicon + Intel,
# .dmg/.app) and Windows (.exe NSIS installer), signs the auto-update
# bundles, and attaches everything to a GitHub release. Runs on version
# tags (v*) or manually from the Actions tab — manual runs only build &
# upload artifacts without publishing. Tagged builds remain draft until all
# platforms pass. The release is made public before its updater manifest is
# deployed, so installed clients never receive private draft-asset URLs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm lint && pnpm test && pnpm exec tsc --noEmit

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check && cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Comtus Desk App v__VERSION__"
          releaseBody: "Installable desktop builds — macOS (.dmg) and Windows (.exe). See the assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The updater manifest is per-platform; keep each so the site's
      # /desktop/latest.json can be assembled from all three.
      - name: Collect updater artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p update-out
          find src-tauri/target -name "latest.json" -exec cp {} update-out/ \; 2>/dev/null || true
          find src-tauri/target -name "*.sig" -exec cp {} update-out/ \; 2>/dev/null || true
          ls update-out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-${{ matrix.rust-target || 'x86_64-pc-windows-msvc' }}
          path: update-out/*
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Each build job uploads an updater-<rust-target> artifact containing
      # its own .sig file, so signature ↔ platform pairing is deterministic.
      # The three jobs also race on a single aggregated latest.json asset
      # (last writer wins) — that file is metadata hints only.
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: update-input

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
          # Version-stripped copies so the website's download links never
          # churn with the release version.
          cp assets/Comtus_*_x64-setup.exe assets/Comtus_x64-setup.exe
          cp assets/Comtus_*_aarch64.dmg assets/Comtus_aarch64.dmg
          cp assets/Comtus_*_x64.dmg assets/Comtus_x64.dmg
          ls assets

      # Installed apps request latest.json from Vercel. The binaries live on a
      # public releases repo because this repo is private and its asset URLs 404.
      - name: Publish installers to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          repo="${{ vars.PUBLIC_RELEASES_REPO || 'yuzuruu29/comtus-releases' }}"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" \
            || gh release create "$GITHUB_REF_NAME" --repo "$repo" --title "$GITHUB_REF_NAME" --notes "Desktop installers"
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber --repo "$repo"

      - name: Build site-hosted updater manifest
        run: |
          repo="${{ vars.PUBLIC_RELEASES_REPO || 'yuzuruu29/comtus-releases' }}"
          mkdir -p public/desktop
          node scripts/build-site-manifest.mjs \
            --artifacts update-input \
            --assets assets \
            --out public/desktop/latest.json \
            --config src-tauri/tauri.conf.json \
            --site-base "https://github.com/${repo}/releases/download/${GITHUB_REF_NAME}"

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" public/desktop/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      - name: Commit hosted updater manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/desktop/latest.json
          git diff --cached --quiet || git commit -m "chore: publish desktop updater $GITHUB_REF_NAME"
          git push origin HEAD:${{ github.event.repository.default_branch }}
